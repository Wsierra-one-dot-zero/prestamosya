name: Deploy App on ECS AWS

on:
  push:
    branches:
      - feature/*
      - main
  workflow_dispatch:
    inputs:
      Name_Ecr_Repository:
        description: 'Name of the ECR repository'
        required: true
        default: 'genos/dev/loans-app'
      environment_name:
        description: 'Deployment environment (dev, staging, production)'
        required: true
        default: 'dev'
      region:
        description: 'AWS region'
        required: true
        default: 'us-east-1'

env:
  ECR_REPO_NAME: ${{ github.event.inputs.Name_Ecr_Repository || 'genos/dev/loans-app' }}
  ENVIRONMENT_ID: ${{ github.event.inputs.environment_name || 'dev' }}
  REGION: ${{ github.event.inputs.region || 'us-east-1' }}

permissions:
  id-token: write
  contents: read

jobs:
  Build:
    name: Build APP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get version
        run: |
          VERSION=$(python -c "from version import __version__; print(__version__)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          
          # Get latest tag if any
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          fi

          echo "VERSION=$VERSION"
          echo "IMAGE_TAG=${{ github.sha }}"
          echo "LATEST_TAG=$LATEST_TAG"

      - name: Run Django collectstatic
        run: |
          python manage.py collectstatic --noinput --settings=prestamosya.settings.ci

      - name: Ensure ECR Public repository exists
        run: |
          set -e
          echo "Using ECR repository: $ECR_REPO_NAME"
          
          if aws ecr-public describe-repositories \
              --region us-east-1 \
              --repository-names "$ECR_REPO_NAME" >/dev/null 2>&1; then
            echo "Repository already exists."
          else
            aws ecr-public create-repository \
              --region us-east-1 \
              --repository-name "$ECR_REPO_NAME"
          fi

          URI_REPO=$(aws ecr-public describe-repositories --repository-names "$ECR_REPO_NAME" --region us-east-1 --query 'repositories[0].repositoryUri' --output text)
          echo "URI_REPO=$URI_REPO" >> $GITHUB_ENV

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin $URI_REPO

      - name: Build Docker image
        run: |
          IMAGE_URI="$URI_REPO:latest"
          docker build -t "$IMAGE_URI" -f docker/Dockerfile . --build-arg DOCKER_BUILDKIT=1
          
          # Tag with version if available
          if [ -n "$VERSION" ]; then
            docker tag "$IMAGE_URI" "$URI_REPO:$VERSION"
          fi
          
          # Tag with latest tag if available
          if [ -n "$LATEST_TAG" ]; then
            docker tag "$IMAGE_URI" "$URI_REPO:$LATEST_TAG"
          fi

      - name: Push image to ECR Public
        run: |
          IMAGE_URI="$URI_REPO:latest"
          docker push "$IMAGE_URI"
          
          # Push version tag if available
          if [ -n "$VERSION" ]; then
            docker push "$URI_REPO:$VERSION"
          fi
          
          # Push latest tag if available
          if [ -n "$LATEST_TAG" ]; then
            docker push "$URI_REPO:$LATEST_TAG"
          fi

  Deploy:
    name: Deploy Application
    needs: Build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment_name || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-1

      - name: Get config file
        id: get_infra_outputs
        run: |
          if [ -f config/config.json ]; then
            echo "[INFO]Config file found"
            echo "[EXEC] cp config/config.json ."
            cp config/config.json .
            ls config.json
          else
            echo "[ERROR]Config file not found"
          fi

      - name: Insert environment variables
        run: |
          ENVIRONMENT_VAR='[
              ["ENVIRONMENT_ID", "${{ env.ENVIRONMENT_ID }}"],
              ["REGION", "${{ env.REGION }}"]
          ]'

          echo "$ENVIRONMENT_VAR" | jq -c '.[]' | while read -r item; do
              key=$(echo "$item" | jq -r '.[0]')
              value=$(echo "$item" | jq -r '.[1]')
              echo "Clave: $key, Valor: $value"

              sed -i "s|\${${key}}|$value|g" config.json

          done

          cat config.json
      
      - name: Insert variables from stack outputs
        run: |
          
          if [[ ! -f "config.json" ]]; then
            echo "Error: El archivo config.json no existe."
            exit 1
          fi

          config_json=$(cat config.json)

          stack_outputs=$(echo "$config_json" | jq -r '.["stack-outputs"][]' 2>/dev/null)

          if [[ -z "$stack_outputs" ]]; then
            echo "No se encontraron stacks en 'stack-outputs'."
            exit 0
          fi

          AWS_TARGET_REGION="us-east-1"

          for stack_name in $stack_outputs; do
            echo "Procesando stack: $stack_name"

            stack_json=$(aws cloudformation describe-stacks --region "$AWS_TARGET_REGION" --stack-name "$stack_name")

            outputs=$(echo "$stack_json" | jq -c '.Stacks[0].Outputs // []')

            if [[ "$outputs" == "[]" ]]; then
              echo "No hay salidas para el stack: $stack_name"
              continue
            fi

            echo "$outputs" | jq -c '.[]' | while read -r output; do
              output_key=$(echo "$output" | jq -r '.OutputKey')
              output_value=$(echo "$output" | jq -r '.OutputValue')

              key="${stack_name}:${output_key}"

              echo "Reemplazando clave: ${key} con valor: ${output_value}"

              sed -i "s|\${${key}}|${output_value}|g" config.json
            done
          done
          echo "Archivo config.json actualizado:"
          cat config.json | jq .
          

      - name: parameter-overrides for cloudformation
        run: |
          jq -r '.deploy.Parameters' config.json > config-parameters.json

          cat config-parameters.json

          SECRET_NAME=$(jq -r '.[] | select(.ParameterKey == "SecretName").ParameterValue' config-parameters.json)
          echo 'Nombre del secreto: $SECRET_NAME'

          SECRET_ARN=$(aws secretsmanager describe-secret --secret-id $SECRET_NAME --region us-east-1 --query 'ARN' --output text)

          jq '. += [{"ParameterKey": "SecretArn", "ParameterValue": "'${SECRET_ARN}'"}]' "config-parameters.json" > temp.json && mv temp.json config-parameters.json

      - name: Deploy Application
        run: |
          STACK_NAME=$(jq -r '.deploy."stack-name"' config.json)

          echo "[EXEC] aws cloudformation deploy --template-file infrastructure/template.yaml --stack-name $STACK_NAME --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND CAPABILITY_NAMED_IAM --parameter-overrides file://config-parameters.json"
          echo "[INFO] Creating or updating stack $STACK_NAME"

          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND CAPABILITY_NAMED_IAM \
            --parameter-overrides file://config-parameters.json

      - name: Create GitHub tag
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$VERSION" ]; then
            git tag -a "$VERSION" -m "Release version $VERSION"
            git push origin "$VERSION"
          fi