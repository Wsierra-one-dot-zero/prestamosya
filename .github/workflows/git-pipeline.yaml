name: Deploy App on ECS AWS

on:
  push:
    branches:
      - feature/*
      - main
  workflow_dispatch:
    inputs:
      Name_Ecr_Repository:
        description: 'Name of the ECR repository'
        required: true
        default: 'genos/dev/loans-app'

env:
  ECR_REPO_NAME: ${{ github.event.inputs.Name_Ecr_Repository || 'genos/dev/loans-app' }}  # Valor por defecto

permissions:
  id-token: write
  contents: read

jobs:
  Build:
    name: Build APP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get version
        run: |
          VERSION=$(python -c "from version import __version__; print(__version__)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          
          # Get latest tag if any
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          fi

      - name: Run Django collectstatic
        run: |
          python manage.py collectstatic --noinput

      - name: Ensure ECR Public repository exists
        run: |
          set -e
          echo "Using ECR repository: $ECR_REPO_NAME"
          
          if aws ecr-public describe-repositories \
              --region us-east-1 \
              --repository-names "$ECR_REPO_NAME" >/dev/null 2>&1; then
            echo "Repository already exists."
          else
            aws ecr-public create-repository \
              --region us-east-1 \
              --repository-name "$ECR_REPO_NAME"
          fi

          URI_REPO=$(aws ecr-public describe-repositories --repository-names "$ECR_REPO_NAME" --region us-east-1 --query 'repositories[0].repositoryUri' --output text)
          echo "URI_REPO=$URI_REPO" >> $GITHUB_ENV

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin $URI_REPO

      - name: Build Docker image
        run: |
          IMAGE_URI="$URI_REPO:latest"
          docker build -t "$IMAGE_URI" .
          
          # Tag with version if available
          if [ -n "$VERSION" ]; then
            docker tag "$IMAGE_URI" "$URI_REPO:$VERSION"
          fi
          
          # Tag with latest tag if available
          if [ -n "$LATEST_TAG" ]; then
            docker tag "$IMAGE_URI" "$URI_REPO:$LATEST_TAG"
          fi

      - name: Push image to ECR Public
        run: |
          IMAGE_URI="$URI_REPO:latest"
          docker push "$IMAGE_URI"
          
          # Push version tag if available
          if [ -n "$VERSION" ]; then
            docker push "$URI_REPO:$VERSION"
          fi
          
          # Push latest tag if available
          if [ -n "$LATEST_TAG" ]; then
            docker push "$URI_REPO:$LATEST_TAG"
          fi

      - name: Create GitHub tag
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$VERSION" ]; then
            git tag -a "$VERSION" -m "Release version $VERSION"
            git push origin "$VERSION"
          fi